services:
  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: yellowpages-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-yellowpages_local_search_key_2026}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - yellowpages_meilisearch_data:/meili_data

volumes:
  yellowpages_meilisearch_data:
