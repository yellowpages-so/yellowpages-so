services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../backend/public:/var/www/backend/public:ro
    depends_on:
      - php
      - frontend

  php:
    build:
      context: ../backend
      dockerfile: ../production/php/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: ../backend
      dockerfile: ../production/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=120 --max-time=3600
    env_file:
      - ../backend/.env.production
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - postgres
      - redis

  scheduler:
    build:
      context: ../backend
      dockerfile: ../production/php/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - ../backend/.env.production
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: ../production/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../frontend/.env.production
    expose:
      - "3000"

  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    env_file:
      - ./postgres/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=200

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
