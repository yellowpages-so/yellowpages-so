services:
  database:
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    container_name: yellowpages-postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Mogadishu

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - yellowpages_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  yellowpages_postgres_data:
    name: yellowpages_postgres_data
